version: '3.8'

services:
  neo4j-test:
    image: neo4j:5.26-community
    container_name: mathtutor-neo4j-test
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/test-password
      - NEO4J_PLUGINS=["apoc"]
    tmpfs:
      - /data
      - /logs
    networks:
      - mathtutor-test-net

networks:
  mathtutor-test-net:
    driver: bridge
