version: '3.8'

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mathtutor-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/mathtutor-dev
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
      - NEO4J_dbms_memory_pagecache_size=1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "mathtutor-dev", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mathtutor-net

  redis:
    image: redis:7-alpine
    container_name: mathtutor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mathtutor-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mathtutor-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=mathtutor-dev
      - NEO4J_DATABASE=neo4j
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src:ro
      - ../specs:/app/specs:ro
    networks:
      - mathtutor-net

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  redis_data:

networks:
  mathtutor-net:
    driver: bridge
